name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kush05Bhardwaj

          filename: metrics/github-metrics.svg

          config_timezone: Asia/Kolkata
          config_padding: 10, 10

          base: activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

  isocalendar:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kush05Bhardwaj

          filename: metrics/isocalendar.svg

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  anilist:
    runs-on: ubuntu-latest

    steps:
      - name: Generate AniList Metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: Kush05Bhardwaj

          filename: metrics/anilist.svg

          base: ""

          plugin_anilist: yes
          plugin_anilist_user: kush2012bhardwaj
          plugin_anilist_medias: anime
          plugin_anilist_sections: watching, characters
          plugin_anilist_limit_characters: 22
          plugin_anilist_limit: 5
          plugin_anilist_shuffle: yes

  music:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Spotify Music Metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: Kush05Bhardwaj

          filename: metrics/music.svg

          base: ""

          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 5
